[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icon-control-plane"
version = "0.1.0"
description = "Exact-action authorization gate for the IETF 127 ICON Control & Enforcement Plane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Public Domain" }
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
icon-control-plane = "icon_control_plane.__main__:main"

[tool.setuptools]
packages = ["icon_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
